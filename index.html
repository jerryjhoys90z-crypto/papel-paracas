<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PAPEL PARACAS - Pedidos</title>
</head>
<body class="bg-slate-50 pb-40 font-sans text-slate-800">

    <header class="bg-white p-6 shadow-sm text-center border-b-4 border-blue-600 sticky top-0 z-50">
        <h1 class="text-2xl font-black text-blue-700 uppercase tracking-tighter">PAPEL PARACAS</h1>
        <p class="text-slate-500 text-[10px] tracking-[0.2em] uppercase font-bold">Catálogo de Ventas Directas</p>
    </header>

    <main id="lista-productos" class="p-4 grid gap-4 grid-cols-2 md:grid-cols-3 lg:grid-cols-4 max-w-6xl mx-auto"></main>

    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-blue-700 text-white p-6 shadow-2xl z-50 rounded-t-[2rem]">
        <div class="flex justify-between items-end mb-4 px-2">
            <div>
                <p class="text-blue-200 font-bold uppercase text-[10px] tracking-widest">Total del Pedido</p>
                <p class="text-3xl font-black">S/ <span id="cart-total">0.00</span></p>
            </div>
            <p id="cart-count" class="bg-blue-500 text-white px-3 py-1 rounded-full text-xs font-black">0 ITEMS</p>
        </div>
        <button onclick="enviarWhatsApp()" class="w-full bg-white text-blue-700 py-4 rounded-2xl font-black uppercase text-sm shadow-xl active:scale-95 transition-all">
            📦 ENVIAR PEDIDO POR WHATSAPP
        </button>
    </div>

    <script>
        const telefono = "51921021960"; // Tu número de WhatsApp
        let carrito = [];

        const productos = [
            { id: 1, nombre: "Papel Higiénico Paracas Clásico x 4", precio: 5.50 },
            { id: 2, nombre: "Papel Higiénico Paracas Premium x 12", precio: 15.00 },
            { id: 3, nombre: "Papel Toalla Interfoliado", precio: 8.50 },
            { id: 4, nombre: "Rollo Institucional 200mt", precio: 12.00 },
            { id: 5, nombre: "Servilletas Paracas x 100", precio: 3.50 },
            { id: 6, nombre: "Papel Higiénico Jumbo", precio: 45.00 }
        ];

        function renderizar() {
            const contenedor = document.getElementById('lista-productos');
            contenedor.innerHTML = "";
            productos.forEach(p => {
                contenedor.innerHTML += `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-200 p-4 flex flex-col">
                    <div class="bg-slate-100 h-32 rounded-2xl mb-3 flex items-center justify-center text-slate-400 font-bold italic">Imagen</div>
                    <h3 class="font-bold text-sm text-slate-700 mb-1 flex-grow">${p.nombre}</h3>
                    <p class="text-blue-600 font-black text-lg mb-3">S/ ${p.precio.toFixed(2)}</p>
                    <button onclick="agregar(${p.id})" class="w-full bg-slate-100 text-slate-800 py-2 rounded-xl font-black text-[10px] uppercase hover:bg-blue-600 hover:text-white transition-all">
                        + Añadir
                    </button>
                </div>`;
            });
        }

        function agregar(id) {
            const p = productos.find(item => item.id === id);
            carrito.push(p);
            actualizarUI();
        }

        function actualizarUI() {
            const total = carrito.reduce((sum, item) => sum + item.precio, 0);
            document.getElementById('cart-total').innerText = total.toFixed(2);
            document.getElementById('cart-count').innerText = `${carrito.length} ITEMS`;
        }

        function enviarWhatsApp() {
            if (carrito.length === 0) return alert("El carrito está vacío");
            const nombre = prompt("¿A nombre de quién registramos el pedido?");
            if (!nombre) return;

            let msj = `*NUEVO PEDIDO: PAPEL PARACAS*%0A*CLIENTE:* ${nombre}%0A------------------------------%0A`;
            carrito.forEach(p => { msj += `• ${p.nombre} (S/ ${p.precio.toFixed(2)})%0A`; });
            msj += `------------------------------%0A*TOTAL: S/ ${document.getElementById('cart-total').innerText}*`;
            window.open(`https://wa.me/${telefono}?text=${msj}`, '_blank');
        }

        renderizar();
    </script>
</body>
</html>
